; PlatformIO project config for Raspberry Pi Pico W / Pico WH
; Uses the earlephilhower Arduino-Pico core via maxgerhardt's PlatformIO platform,
; which is required for BLE support (mainline PlatformIO raspberrypi platform
; doesn't have it yet).
 
[env:rpipicow]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipicow
framework = arduino
board_build.core = earlephilhower
 
; No filesystem needed for this project, keep it all as sketch space
board_build.filesystem_size = 0m
 
; Turns on the BTStack-based Bluetooth Classic + BLE stack (~80KB flash, ~20KB RAM)
build_flags =
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_BLUETOOTH
 
monitor_speed = 115200
 
